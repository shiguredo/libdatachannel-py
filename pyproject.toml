[project]
name = "libdatachannel-py"
description = "libdatachannel-py is a Python binding for libdatachannel."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shiguredo Inc.", email = "contact+pypi@shiguredo.jp" }]
classifiers = [
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
]
dynamic = ["version"]

[project.urls]
Discord = "https://discord.gg/shiguredo"
Source = "https://github.com/shiguredo/libdatachannel-py"

[dependency-groups]
dev = [
  { include-group = "example" },
  { include-group = "test" },
]
example = [
  "blend2d-py",
  "httpx",
  "portaudio-py",
  "raw-player",
  "structlog",
  "uvc-py",
  "webcodecs-py",
]
test = [
  "aiohttp",
  "hypothesis",
  "numpy",
  "pytest",
  "pytest-aiohttp",
  "pytest-timeout",
]

[build-system]
requires = ["nanobind>=3.1.0", "scikit-build-core>=1.1.1"]
build-backend = "scikit_build_core.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
