[project]
name = "libdatachannel-py"
description = "libdatachannel-py is a Python binding for libdatachannel."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shiguredo Inc.", email = "contact+pypi@shiguredo.jp" }]
classifiers = [
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
]
dynamic = ["version"]

[project.urls]
Discord = "https://discord.gg/shiguredo"
Source = "https://github.com/shiguredo/libdatachannel-py"

[dependency-groups]
dev = [
  { include-group = "example" },
  { include-group = "lint" },
  { include-group = "test" },
]
example = [
  "blend2d-py",
  "httpx",
  "portaudio-py",
  "raw-player",
  "structlog",
  "uvc-py",
  "webcodecs-py",
]
lint = ["ruff", "ty"]
test = [
  "aiohttp",
  "hypothesis",
  "numpy",
  "pytest",
  "pytest-aiohttp",
  "pytest-timeout",
]

[build-system]
requires = ["nanobind>=2.13.0", "scikit-build-core>=1.0.3"]
build-backend = "scikit_build_core.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.scikit-build]
# build-system.requires の scikit-build-core 最小バージョンと同期する
minimum-version = "build-system.requires"
sdist.include = ["VERSION", "deps.json"]
build-dir = "_build"

[tool.scikit-build.cmake]
version = ">=4.3"
define = { "CMAKE_CXX_STANDARD" = "20" }

[tool.scikit-build.build]
verbose = false

[tool.scikit-build.wheel]
packages = ["src/libdatachannel"]
expand-macos-universal-tags = true

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "^(?P<value>.+)$"

[tool.ty.src]
exclude = ["src/libdatachannel/__init__.py"]

[tool.uv]
package = false
managed = true
python-preference = "only-managed"
