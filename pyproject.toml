[tool.scikit-build]
# build-system.requires の scikit-build-core 最小バージョンと同期する
minimum-version = "build-system.requires"
sdist.include = ["VERSION", "deps.json"]
build-dir = "_build"

[tool.scikit-build.cmake]
version = ">=4.3"
define = { "CMAKE_CXX_STANDARD" = "20" }

[tool.scikit-build.build]
verbose = false

[tool.scikit-build.wheel]
packages = ["src/libdatachannel"]
expand-macos-universal-tags = true

# 標準記法 [[tool.dynamic-metadata]] への移行は tombi が拒否するため見送る
# (schemastore の pyproject スキーマが tool.* を一律 Table として扱うため Array にできない)。
# この記法は scikit-build-core 1.0 以降 deprecation warning を出す
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "^(?P<value>.+)$"

[tool.ty.src]
exclude = ["src/libdatachannel/__init__.py"]

[tool.uv]
package = false
managed = true
python-preference = "only-managed"
