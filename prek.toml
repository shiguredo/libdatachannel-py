# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

exclude = { glob = ["_deps/**", "_build/**", ".venv/**"] }

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", priority = 0 },
  { id = "end-of-file-fixer", priority = 0 },
  { id = "check-toml", priority = 0 },
  {
    id = "check-yaml",
    priority = 0,
    exclude = { glob = [".clang-format"] }
  },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.14.14"
hooks = [
  { id = "ruff-format", priority = 0 },
  { id = "ruff-check", args = ["--fix"], priority = 10 },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.2.4"
hooks = [
  { id = "tombi-lint", exclude = { glob = "**/uv.lock" } },
  { id = "tombi-format", exclude = { glob = "**/uv.lock" } },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "ty-check",
    name = "ty check",
    entry = "uv run ty check",
    language = "system",
    types = ["python"],
    pass_filenames = false,
    priority = 20,
  },
  {
    id = "clang-format",
    name = "clang-format",
    entry = "clang-format -i",
    language = "system",
    types_or = ["c", "c++", "objective-c"],
    priority = 10,
  },
]
